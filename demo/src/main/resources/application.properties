spring.application.name=demo

# The key stays in the backend environment.
shop.ai.key=${GROQ_API_KEY:}
shop.ai.model=${GROQ_MODEL:openai/gpt-oss-20b}
server.address=127.0.0.1

# Create and seed store knowledge before JPA starts; existing paragraphs are preserved.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:store-schema.sql
spring.sql.init.data-locations=classpath:store-data.sql
